name: stock-market-simulator

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocksim}
      POSTGRES_USER: ${POSTGRES_USER:-stocksim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksim}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocksim} -d ${POSTGRES_DB:-stocksim}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-stocksim}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-stocksim}
      DB_NAME: ${POSTGRES_DB:-stocksim}
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
